[project]
name = "bhar"
version = "0.1.0"
description = "Site-Tuned Model Blend - backtest NOAA models at one site and find the best weighted blend"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "numpy==2.5.2",
    "requests==2.34.2",
    "xarray==2026.7.0",
    "cfgrib==0.9.15.1",
    "eccodes==2.48.0",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "httpx==0.28.1",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "integration: runs against captured fixtures on disk; never live network (SPEC 13)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401"]
"*/__init__.py" = ["F401"]
